<!DOCTYPE html>
<html>
<head>
    <title>Google</title>

    <style>
        body{
            background-color:#202124;
            color:white;
            font-family:Arial;
            text-align:center;
        }

        h1{
            font-size:90px;
            margin-top:150px;
        }

        input{
            width:500px;
            padding:15px;
            border-radius:30px;
            border:none;
        }

        button{
            padding:10px 20px;
            margin-top:30px;
            background-color:#303134;
            color:white;
            border:none;
            border-radius:5px;
        }

        footer{
            position:fixed;
            bottom:0;
            width:100%;
            background:#171717;
            padding:15px;
        }
    </style>
</head>

<body>

    <h1>Google</h1>

    <input type="text" placeholder="">

    <br>

    <button>Sök på Google</button>
    <button>Jag har tur</button>

    <footer>
        Sverige | Integritet | Villkor | Inställningar
    </footer>

</body>
</html>
